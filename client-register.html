<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Crie sua conta de paciente na Cuidare">
  <title>Criar conta | Cuidare</title>
  <style>
    :root {
      --ink: #17211d;
      --muted: #68756e;
      --paper: #f5f7f2;
      --panel: #ffffff;
      --line: #dce4dc;
      --accent: #196a52;
      --accent-dark: #0f4d3b;
      --focus: #a8d8c4;
      --error: #a13b34;
      --ok: #196a52;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-width: 320px;
      min-height: 100vh;
      color: var(--ink);
      background: var(--paper);
      font-family: Georgia, 'Times New Roman', serif;
    }

    .page {
      display: grid;
      grid-template-columns: minmax(280px, 0.8fr) minmax(420px, 1.2fr);
      min-height: 100vh;
    }

    .intro {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: clamp(2rem, 6vw, 5.5rem);
      color: #edf6f0;
      background: var(--accent-dark);
      background-image: radial-gradient(circle at 15% 15%, rgba(255,255,255,.12) 0 1px, transparent 1px),
        linear-gradient(145deg, #0f4d3b 0%, #196a52 58%, #2d8163 100%);
      background-size: 24px 24px, auto;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: .75rem;
      width: fit-content;
      color: inherit;
      font-size: 1.25rem;
      font-weight: bold;
      letter-spacing: .02em;
      text-decoration: none;
    }

    .brand-mark {
      display: grid;
      place-items: center;
      width: 2.35rem;
      height: 2.35rem;
      border: 1px solid rgba(255,255,255,.55);
      border-radius: 50%;
      font-family: Arial, sans-serif;
      font-size: .95rem;
      font-weight: 700;
    }

    .intro-copy { max-width: 27rem; margin-block: auto; padding-block: 4rem; }

    .eyebrow {
      margin: 0 0 1.25rem;
      color: #b9e3d0;
      font-family: Arial, sans-serif;
      font-size: .73rem;
      font-weight: 700;
      letter-spacing: .16em;
      text-transform: uppercase;
    }

    h1 {
      max-width: 12ch;
      margin: 0;
      font-size: clamp(2.7rem, 5vw, 5.3rem);
      font-weight: 400;
      line-height: .98;
    }

    .intro-copy p:last-child {
      max-width: 24rem;
      margin: 1.5rem 0 0;
      color: #d4e9dd;
      font-family: Arial, sans-serif;
      font-size: .96rem;
      line-height: 1.65;
    }

    .privacy {
      margin: 0;
      color: #b9e3d0;
      font-family: Arial, sans-serif;
      font-size: .72rem;
      letter-spacing: .04em;
    }

    .form-area {
      display: grid;
      place-items: center;
      padding: clamp(2rem, 7vw, 7rem);
      background: var(--panel);
    }

    .register-form { width: min(100%, 28rem); }
    .form-heading { margin-bottom: 2.25rem; }

    .form-heading h2 {
      margin: 0 0 .6rem;
      font-size: clamp(1.8rem, 3vw, 2.45rem);
      font-weight: 400;
    }

    .form-heading p {
      margin: 0;
      color: var(--muted);
      font-family: Arial, sans-serif;
      font-size: .88rem;
    }

    .form-heading .login-link { margin-top: .5rem; }
    .form-heading a { color: var(--accent-dark); text-underline-offset: 3px; }

    .field { margin-bottom: 1.2rem; }

    label {
      display: block;
      margin-bottom: .5rem;
      font-family: Arial, sans-serif;
      font-size: .78rem;
      font-weight: 700;
      letter-spacing: .04em;
    }

    .hint {
      margin: .45rem 0 0;
      color: var(--muted);
      font: .74rem Arial, sans-serif;
    }

    input {
      width: 100%;
      min-height: 3.25rem;
      border: 1px solid var(--line);
      border-radius: 3px;
      padding: .8rem .95rem;
      color: var(--ink);
      background: #fbfcfa;
      font: 1rem Arial, sans-serif;
      transition: border-color .2s, box-shadow .2s, background-color .2s;
    }

    input:focus {
      outline: none;
      border-color: var(--accent);
      background: #fff;
      box-shadow: 0 0 0 3px var(--focus);
    }

    .password-wrap { position: relative; }
    .password-wrap input { padding-right: 5rem; }

    .password-toggle {
      position: absolute;
      top: 50%;
      right: .7rem;
      border: 0;
      padding: .4rem;
      color: var(--accent-dark);
      background: transparent;
      cursor: pointer;
      font: 700 .72rem Arial, sans-serif;
      transform: translateY(-50%);
    }

    .password-toggle:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

    .submit-button {
      width: 100%;
      min-height: 3.25rem;
      border: 0;
      border-radius: 3px;
      color: #fff;
      background: var(--accent);
      cursor: pointer;
      font: 700 .82rem Arial, sans-serif;
      letter-spacing: .08em;
      text-transform: uppercase;
      transition: background-color .2s, transform .2s;
    }

    .submit-button:hover { background: var(--accent-dark); }
    .submit-button:active { transform: translateY(1px); }
    .submit-button:disabled { background: var(--muted); cursor: wait; }
    .submit-button:focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; }

    .status {
      min-height: 1.4rem;
      margin: 1rem 0 0;
      color: var(--error);
      font: .8rem Arial, sans-serif;
      line-height: 1.6;
    }

    .notice {
      margin: 1.25rem 0 0;
      border: 1px solid var(--line);
      border-left: 3px solid var(--accent);
      border-radius: 4px;
      padding: 1rem 1.1rem;
      background: #f6faf7;
      color: var(--ink);
      font: .82rem Arial, sans-serif;
      line-height: 1.65;
    }

    .notice a { color: var(--accent-dark); font-weight: 700; text-underline-offset: 3px; }

    @media (max-width: 760px) {
      .page { grid-template-columns: 1fr; }
      .intro { min-height: 23rem; padding: 1.75rem; }
      .intro-copy { padding-block: 2.5rem 1.5rem; }
      h1 { font-size: clamp(2.6rem, 14vw, 4rem); }
      .form-area { padding: 3rem 1.75rem 4rem; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <main class="page">
    <section class="intro" aria-labelledby="welcome-heading">
      <a class="brand" href="index.html" aria-label="Página inicial da Cuidare">
        <span class="brand-mark" aria-hidden="true">C</span>
        Cuidare
      </a>

      <div class="intro-copy">
        <p class="eyebrow">Área do paciente</p>
        <h1 id="welcome-heading">Crie sua conta.</h1>
        <p>Uma conta sua, válida para todos os profissionais que cuidam de você.</p>
      </div>

      <p class="privacy">Ambiente seguro para pacientes Cuidare</p>
    </section>

    <section class="form-area" aria-labelledby="register-heading">
      <div class="register-form">
        <form id="client-register-form" novalidate>
          <div class="form-heading">
            <h2 id="register-heading">Cadastro do paciente</h2>
            <p>Preencha os dados abaixo para começar.</p>
            <p class="login-link">Já tem conta? <a href="client-login.html">Entrar</a></p>
          </div>

          <div class="field">
            <label for="full_name">Nome completo</label>
            <input id="full_name" name="full_name" type="text" autocomplete="name" placeholder="Como você se chama" required maxlength="160">
          </div>

          <div class="field">
            <label for="email">E-mail</label>
            <input id="email" name="email" type="email" autocomplete="email" placeholder="seu@email.com" required>
          </div>

          <div class="field">
            <label for="phone">Telefone <span style="font-weight:400;color:var(--muted);">(opcional)</span></label>
            <input id="phone" name="phone" type="tel" autocomplete="tel" placeholder="(11) 90000-0000">
          </div>

          <div class="field">
            <label for="password">Senha</label>
            <div class="password-wrap">
              <input id="password" name="password" type="password" autocomplete="new-password" placeholder="Crie uma senha" required minlength="8">
              <button class="password-toggle" id="password-toggle" type="button" aria-controls="password" aria-label="Mostrar senha">Mostrar</button>
            </div>
            <p class="hint">No mínimo 8 caracteres.</p>
          </div>

          <button class="submit-button" type="submit">Criar minha conta</button>
          <p class="status" id="form-status" role="status" aria-live="polite"></p>
        </form>

        <!-- Aparece só depois do 201: o e-mail de verificação foi enviado. -->
        <div class="notice" id="register-done" style="display:none;">
          <strong>Cadastro criado.</strong>
          <p style="margin:.5rem 0 0;" id="register-done-message"></p>
          <p style="margin:.75rem 0 0;">
            <a id="register-done-login" href="client-login.html">Ir para o login</a>
          </p>
        </div>
      </div>
    </section>
  </main>

  <script src="assets/api.js"></script>
  <script>
    const apiBase = CuidareApi.base;

    // Mesma proteção do login: resposta não-JSON não pode virar tela branca.
    async function lerJson(response, padrao) { try { return await response.json(); } catch { return padrao; } }

    // Convite em aberto viaja pela URL (`?invite=`), nunca por storage: o
    // sessionStorage da área do cliente guarda somente o token de sessão.
    const inviteToken = new URLSearchParams(window.location.search).get('invite');

    const form = document.querySelector('#client-register-form');
    const status = document.querySelector('#form-status');
    const done = document.querySelector('#register-done');
    const doneMessage = document.querySelector('#register-done-message');
    const doneLogin = document.querySelector('#register-done-login');
    const submitButton = form.querySelector('.submit-button');

    if (inviteToken) {
      document.querySelector('#register-done-login').setAttribute(
        'href',
        `client-login.html?invite=${encodeURIComponent(inviteToken)}`
      );
    }

    document.querySelector('#password-toggle').addEventListener('click', (event) => {
      const password = document.querySelector('#password');
      const isPassword = password.type === 'password';
      password.type = isPassword ? 'text' : 'password';
      event.currentTarget.textContent = isPassword ? 'Ocultar' : 'Mostrar';
      event.currentTarget.setAttribute('aria-label', `${isPassword ? 'Ocultar' : 'Mostrar'} senha`);
    });

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      status.textContent = '';
      status.style.color = 'var(--error)';
      done.style.display = 'none';

      if (!form.reportValidity()) {
        return;
      }

      submitButton.disabled = true;
      submitButton.textContent = 'Criando conta...';

      try {
        // Cadastro NÃO cria vínculo com psicólogo nenhum: um vínculo só nasce
        // quando o cliente pede e o profissional aceita, ou quando o
        // profissional convida. Nada é associative aqui.
        const response = await fetch(`${apiBase}/api/client/auth/register`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            full_name: form.full_name.value,
            email: form.email.value,
            phone: form.phone.value,
            password: form.password.value
          })
        });
        const result = await lerJson(response, {});

        if (!response.ok) {
          throw new Error(result.error || 'Não foi possível criar a conta.');
        }

        form.style.display = 'none';
        doneMessage.textContent = result.message
          || 'Verifique seu e-mail para ativar a conta.';
        done.style.display = 'block';

        if (!result.email_sent) {
          doneMessage.textContent += ' Se o e-mail não chegar, você precisará de um novo link de verificação.';
        }

        if (inviteToken) {
          doneMessage.textContent += ' Depois de confirmar o e-mail, faça login e abra o convite novamente para aceitá-lo.';
        }
      } catch (error) {
        status.textContent = error.message === 'Failed to fetch'
          ? 'Não foi possível conectar ao servidor.'
          : error.message;
      } finally {
        submitButton.disabled = false;
        submitButton.textContent = 'Criar minha conta';
      }
    });
  </script>
</body>
</html>
