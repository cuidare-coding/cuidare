<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Clientes do psicólogo Cuidare">
  <title>Clientes | Cuidare</title>
  <script>document.documentElement.classList.add('auth-checking');</script>
  <script src="assets/api.js"></script>
  <script src="assets/format.js"></script>
  <script src="assets/auth-guard.js"></script>
  <script>
    CuidareAuth.guard({
      tokenKey: 'cuidare_access_token',
      redirect: 'login.html',
      accountType: 'psychologist',
      invalidMessage: 'Sessão inválida.'
    });
  </script>
  <style>
    html.auth-checking body { visibility: hidden; }
    :root { --ink: #17211d; --muted: #68756e; --paper: #f3f6f1; --panel: #fff; --line: #dfe7df; --accent: #196a52; --accent-dark: #0f4d3b; --mint: #d9eee3; --red: #a13b34; --shadow: 0 18px 40px rgba(28, 62, 47, .07); }
    * { box-sizing: border-box; }
    body { margin: 0; min-width: 320px; color: var(--ink); background: var(--paper); font-family: Arial, sans-serif; }
    button, input, textarea, a { font: inherit; -webkit-tap-highlight-color: transparent; }
    .app-shell { display: grid; grid-template-columns: 17rem minmax(0, 1fr); min-height: 100vh; }
    .sidebar { position: sticky; top: 0; display: flex; flex-direction: column; height: 100vh; padding: 1.5rem 1rem; color: #eef7f1; background: var(--accent-dark); background-image: radial-gradient(circle at 20% 15%, rgba(255,255,255,.11) 0 1px, transparent 1px), linear-gradient(160deg, #0f4d3b, #196a52 70%, #2b8062); background-size: 22px 22px, auto; }
    .brand { display: inline-flex; align-items: center; gap: .7rem; margin: .25rem .65rem 2.5rem; color: inherit; font: bold 1.2rem Georgia, 'Times New Roman', serif; text-decoration: none; }
    .brand-mark, .avatar { display: grid; place-items: center; border-radius: 50%; }
    .brand-mark { width: 2.25rem; height: 2.25rem; border: 1px solid rgba(255,255,255,.55); font-size: .9rem; }
    .nav-label { margin: 0 .8rem .7rem; color: #add7c3; font-size: .65rem; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; }
    .nav-list { display: grid; gap: .35rem; }
    .nav-link { display: flex; align-items: center; gap: .75rem; min-height: 2.9rem; border: 1px solid transparent; border-radius: 5px; padding: .65rem .8rem; color: #cce6d8; font-size: .82rem; text-decoration: none; }
    .nav-link:hover, .nav-link.active { color: #fff; background: rgba(255,255,255,.12); border-color: rgba(255,255,255,.1); }
    .nav-icon { display: grid; place-items: center; width: 1.35rem; color: #a9d9c2; }
    .sidebar-footer { margin-top: auto; border-top: 1px solid rgba(255,255,255,.15); padding: 1rem .65rem .25rem; }
    .admin-mini { display: flex; align-items: center; gap: .65rem; margin-bottom: .9rem; }
    .avatar { width: 2.25rem; height: 2.25rem; color: var(--accent-dark); background: #d8eee2; font-weight: 700; }
    .admin-mini strong { display: block; font: .8rem Georgia, 'Times New Roman', serif; }
    .admin-mini span { display: block; margin-top: .2rem; color: #add7c3; font-size: .67rem; }
    .logout-button { width: 100%; border: 0; padding: .55rem 0; color: #cce6d8; background: transparent; cursor: pointer; font-size: .75rem; text-align: left; }
    .edit-profile-btn { display: flex; align-items: center; gap: .45rem; width: 100%; border: 1px solid rgba(255,255,255,.2); border-radius: 5px; padding: .48rem .75rem; color: #cce6d8; background: rgba(255,255,255,.07); cursor: pointer; font-size: .73rem; margin-bottom: .55rem; transition: background .15s; }
    .edit-profile-btn:hover { background: rgba(255,255,255,.14); color: #fff; }
    .main { width: 100%; max-width: 1180px; min-width: 0; margin: 0 auto; padding: 1.5rem clamp(1.25rem, 4vw, 3.5rem) 3rem; }
    .topbar { display: flex; justify-content: flex-end; min-height: 3rem; margin-bottom: 2.35rem; }
    .topbar-avatar { display: grid; place-items: center; width: 2.6rem; height: 2.6rem; border-radius: 50%; color: #fff; background: var(--accent); font-size: .76rem; font-weight: 700; cursor: pointer; transition: opacity .15s; border: 0; }
    .topbar-avatar:hover { opacity: .82; }
    .page-heading { display: flex; align-items: end; justify-content: space-between; gap: 1rem; margin-bottom: 1.9rem; }
    .eyebrow { margin: 0 0 .55rem; color: var(--accent); font-size: .68rem; font-weight: 700; letter-spacing: .15em; text-transform: uppercase; }
    h1, h2 { font-family: Georgia, 'Times New Roman', serif; font-weight: 400; }
    h1 { margin: 0; font-size: clamp(2rem, 4vw, 3.15rem); line-height: 1; }
    .page-description { margin: .7rem 0 0; color: var(--muted); font-size: .82rem; }
    .primary-button { border: 0; border-radius: 4px; padding: .8rem 1rem; color: #fff; background: var(--accent); cursor: pointer; font-size: .78rem; font-weight: 700; }
    .primary-button:hover { background: var(--accent-dark); }
    .panel { border: 1px solid var(--line); border-radius: 6px; background: var(--panel); box-shadow: var(--shadow); }
    .panel-header { display: flex; align-items: center; justify-content: space-between; gap: 1rem; padding: 1.25rem 1.35rem 1rem; }
    .panel-header h2 { margin: 0; font-size: 1.25rem; }
    .search { min-height: 2.6rem; width: min(100%, 18rem); border: 1px solid var(--line); border-radius: 4px; padding: .6rem .75rem; color: var(--ink); background: #fbfcfa; font-size: .78rem; }
    .table-wrap { overflow-x: auto; padding: 0 1.35rem 1.25rem; }
    table { width: 100%; border-collapse: collapse; font-size: .74rem; }
    th { padding: .7rem .55rem; color: var(--muted); font-size: .63rem; text-align: left; text-transform: uppercase; }
    td { border-top: 1px solid var(--line); padding: .85rem .55rem; vertical-align: middle; }
    th:first-child, td:first-child { padding-left: 0; }
    .client-name strong { display: block; font: .83rem Georgia, 'Times New Roman', serif; }
    .client-name span { display: block; margin-top: .2rem; color: var(--muted); font-size: .67rem; }
    td.muted { color: var(--muted); font-size: .67rem; }
    .client-cell { display: flex; align-items: center; gap: .7rem; min-width: 15rem; }
    .client-avatar { display: grid; place-items: center; flex: 0 0 auto; width: 2.3rem; height: 2.3rem; border-radius: 50%; color: var(--accent-dark); background: var(--mint); font-size: .68rem; font-weight: 700; }
    .client-detail { min-width: 0; }
    .client-detail strong { display: block; overflow: hidden; font: .83rem Georgia, 'Times New Roman', serif; text-overflow: ellipsis; white-space: nowrap; }
    .client-detail span { display: block; overflow: hidden; margin-top: .2rem; color: var(--muted); font-size: .67rem; text-overflow: ellipsis; white-space: nowrap; }
    .data-label { display: none; margin-bottom: .2rem; color: var(--muted); font-size: .6rem; text-transform: uppercase; }
    .actions-cell { position: relative; width: 3rem; text-align: right; }
    .actions-button { border: 1px solid var(--line); border-radius: 3px; padding: .4rem .55rem; color: var(--accent-dark); background: #fbfcfa; cursor: pointer; }
    .actions-button:hover { border-color: var(--accent); background: var(--mint); }
    .actions-menu { position: absolute; right: 0; top: calc(100% - .4rem); display: none; min-width: 9rem; border: 1px solid var(--line); border-radius: 4px; padding: .3rem; background: #fff; box-shadow: var(--shadow); z-index: 5; }
    .actions-menu.open { display: grid; }
    .actions-menu button { border: 0; padding: .55rem .65rem; color: var(--ink); background: transparent; cursor: pointer; font-size: .7rem; text-align: left; white-space: nowrap; }
    .actions-menu button:hover { background: var(--mint); }
    .actions-menu .delete-action { color: var(--red); }
    .empty { padding: 1.5rem 0; color: var(--muted); }
    .modal-backdrop { position: fixed; inset: 0; display: grid; place-items: center; padding: 1rem; background: rgba(16,35,27,.45); opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 20; }
    .modal-backdrop.open { opacity: 1; pointer-events: auto; }
    .modal { width: min(100%, 32rem); border-radius: 6px; padding: 1.5rem; background: #fff; box-shadow: 0 24px 60px rgba(16,35,27,.2); }
    .modal-header { display: flex; justify-content: space-between; margin-bottom: 1.3rem; }
    .modal-header h2 { margin: 0; font-size: 1.5rem; }
    .close-button { border: 0; color: var(--muted); background: transparent; cursor: pointer; font-size: 1.35rem; }
    .form-grid { display: grid; gap: .9rem; }
    label { display: grid; gap: .4rem; color: var(--ink); font-size: .72rem; font-weight: 700; }
    input, textarea { min-height: 2.8rem; border: 1px solid var(--line); border-radius: 4px; padding: .65rem .75rem; color: var(--ink); background: #fbfcfa; font-size: .8rem; }
    textarea { min-height: 5rem; resize: vertical; }
    .modal-actions { display: flex; justify-content: flex-end; gap: .6rem; margin-top: 1.4rem; }
    .secondary-button { border: 1px solid var(--line); border-radius: 4px; padding: .75rem 1rem; color: var(--muted); background: #fff; cursor: pointer; font-size: .75rem; }
    .toast { position: fixed; right: 1.25rem; bottom: 1.25rem; max-width: 22rem; border: 1px solid var(--line); border-radius: 5px; padding: .85rem 1rem; color: var(--ink); background: #fff; box-shadow: var(--shadow); font-size: .78rem; opacity: 0; pointer-events: none; transform: translateY(1rem); transition: opacity .2s, transform .2s; z-index: 30; }
    .toast.show { opacity: 1; transform: translateY(0); }
    @media (max-width: 850px) { .app-shell { display: block; } .sidebar { position: static; height: auto; min-height: auto; } .sidebar-footer { margin-top: 2rem; } .page-heading, .panel-header { display: block; } .page-heading .primary-button { width: 100%; margin-top: 1.2rem; } .search { width: 100%; margin-top: 1rem; } .table-wrap { padding-inline: 1rem; } table, tbody { display: block; min-width: 0; } thead { display: none; } tbody tr { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: .7rem; border-top: 1px solid var(--line); padding: 1rem 0; } tbody td { display: block; border: 0; padding: 0; min-width: 0; } tbody td:first-child { grid-column: 1 / -1; } tbody td:nth-last-child(1) { grid-column: 1 / -1; text-align: right; } tbody td:not(:first-child) { border: 0; padding-top: .1rem; } tbody .data-label { display: block; } .actions-menu { top: auto; bottom: calc(100% - .4rem); } }
  </style>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" aria-label="Navegação principal"><a class="brand" href="psychologist-dashboard.html"><span class="brand-mark">C</span>Cuidare</a><p class="nav-label">Meu espaço</p><nav class="nav-list"><a class="nav-link" href="psychologist-dashboard.html"><span class="nav-icon">⌂</span>Visão geral</a><a class="nav-link" href="psychologist-agenda.html"><span class="nav-icon">□</span>Agenda</a><a class="nav-link active" href="psychologist-clients.html"><span class="nav-icon">○</span>Clientes</a><a class="nav-link" href="psychologist-finances.html"><span class="nav-icon">＄</span>Financeiro</a></nav><div class="sidebar-footer"><div class="admin-mini"><span class="avatar" id="sidebar-avatar">--</span><div><strong id="sidebar-name">Psicólogo</strong><span>Profissional Cuidare</span></div></div><button class="edit-profile-btn" id="open-edit-modal" type="button">✎&nbsp; Editar perfil</button><button class="logout-button" id="logout-button" type="button">↪&nbsp; Sair da conta</button></div></aside>
    <main class="main"><header class="topbar"><button class="topbar-avatar" id="topbar-avatar" title="Editar perfil" aria-label="Editar perfil">--</button></header><section class="page-heading"><div><p class="eyebrow">Sua prática</p><h1>Clientes</h1><p class="page-description">Cadastre e organize as pessoas que você acompanha.</p></div><button class="primary-button" id="new-client" type="button">+ Cadastrar cliente</button></section><section class="panel"><div class="panel-header"><h2>Minha carteira</h2><input class="search" id="search" type="search" placeholder="Buscar por nome ou e-mail" aria-label="Buscar clientes"></div><div class="table-wrap"><table><thead><tr><th>Cliente</th><th>Telefone</th><th>Nascimento</th><th>Cadastro</th><th>Ações</th></tr></thead><tbody id="clients-list"><tr><td colspan="5" class="empty">Carregando clientes...</td></tr></tbody></table></div></section></main>
  </div>
  <div class="modal-backdrop" id="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title"><div class="modal"><div class="modal-header"><h2 id="modal-title">Cadastrar cliente</h2><button class="close-button" id="close-modal" type="button" aria-label="Fechar">×</button></div><form id="client-form" class="form-grid"><label>Nome completo<input name="name" required placeholder="Nome do cliente"></label><label>E-mail (opcional)<input name="email" type="email" placeholder="cliente@email.com"></label><label>Telefone (opcional)<input name="phone" type="tel" placeholder="(00) 00000-0000"></label><label>Data de nascimento (opcional)<input name="birth_date" type="date"></label><label>Observações (opcional)<textarea name="notes" placeholder="Informações administrativas ou observações iniciais"></textarea></label><div class="modal-actions"><button class="secondary-button" id="cancel-modal" type="button">Cancelar</button><button class="primary-button" type="submit">Salvar cliente</button></div></form></div></div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script>
    const token = sessionStorage.getItem('cuidare_access_token');
    const apiBase = CuidareApi.base;
    const modal = document.querySelector('#modal');
    const form = document.querySelector('#client-form');
    const clientsList = document.querySelector('#clients-list');
    const toast = document.querySelector('#toast');
    let clients = [];
    let editingClientId = null;
    function showToast(message) { toast.textContent = message; toast.classList.add('show'); window.clearTimeout(showToast.timeout); showToast.timeout = window.setTimeout(() => toast.classList.remove('show'), 2800); }
    function date(value) { return value ? new Intl.DateTimeFormat('pt-BR').format(new Date(`${value}T00:00:00`)) : 'Não informada'; }
    async function lerJson(response, padrao) { try { return await response.json(); } catch { return padrao; } }
    function setModal(open) { modal.classList.toggle('open', open); if (open) form.elements.name.focus(); }
    function renderClients() { const query = document.querySelector('#search').value.toLowerCase(); const filtered = clients.filter((client) => `${client.name} ${client.email || ''}`.toLowerCase().includes(query)); clientsList.innerHTML = filtered.length ? filtered.map((client) => `<tr data-id="${client.id}"><td><div class="client-cell"><span class="client-avatar">${CuidareFormat.escapeHtml(CuidareFormat.initials(client.name))}</span><div class="client-detail"><strong>${CuidareFormat.escapeHtml(client.name)}</strong><span>${CuidareFormat.escapeHtml(client.email || 'Sem e-mail')}</span></div></div></td><td class="muted"><span class="data-label">Contato</span>${CuidareFormat.escapeHtml(client.phone || 'Não informado')}</td><td class="muted"><span class="data-label">Nascimento</span>${CuidareFormat.escapeHtml(date(client.birth_date))}</td><td class="muted"><span class="data-label">Cadastrado</span>${CuidareFormat.escapeHtml(date(client.created_at?.slice(0, 10)))}</td><td class="actions-cell"><button class="actions-button" type="button" aria-label="Abrir ações">•••</button><div class="actions-menu"><button type="button" data-action="edit">Editar cliente</button><button class="delete-action" type="button" data-action="delete">Excluir cliente</button></div></td></tr>`).join('') : '<tr><td colspan="5" class="empty">Nenhum cliente encontrado.</td></tr>'; }
    async function loadClients() { try { const response = await fetch(`${apiBase}/api/clients`, { headers: { Authorization: `Bearer ${token}` } }); const result = await lerJson(response, {}); if (!response.ok) throw new Error(result.error || 'Não foi possível carregar os clientes.'); clients = result.clients || []; renderClients(); } catch (error) { clientsList.innerHTML = `<tr><td colspan="5" class="empty">${CuidareFormat.escapeHtml(error.message)}</td></tr>`; showToast(error.message); } }
    form.addEventListener('submit', async (event) => { event.preventDefault(); if (!form.reportValidity()) return; const button = form.querySelector('[type="submit"]'); button.disabled = true; try { const response = await fetch(`${apiBase}/api/clients${editingClientId ? `/${editingClientId}` : ''}`, { method: editingClientId ? 'PUT' : 'POST', headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${token}` }, body: JSON.stringify(Object.fromEntries(new FormData(form).entries())) }); const result = await lerJson(response, {}); if (!response.ok) throw new Error(result.error || 'Não foi possível salvar o cliente.'); if (editingClientId) clients = clients.map((client) => client.id === editingClientId ? result.client : client); else clients.push(result.client); renderClients(); form.reset(); editingClientId = null; document.querySelector('#modal-title').textContent = 'Cadastrar cliente'; setModal(false); showToast('Cliente salvo com sucesso.'); } catch (error) { showToast(error.message); } finally { button.disabled = false; } });
    clientsList.addEventListener('click', async (event) => { const row = event.target.closest('tr[data-id]'); if (!row) return; const client = clients.find((item) => String(item.id) === row.dataset.id); if (!client) return; const actionButton = event.target.closest('.actions-button'); if (actionButton) { document.querySelectorAll('.actions-menu.open').forEach((menu) => menu.classList.remove('open')); actionButton.nextElementSibling.classList.toggle('open'); return; } const action = event.target.closest('[data-action]')?.dataset.action; if (action === 'edit') { editingClientId = client.id; form.elements.name.value = client.name || ''; form.elements.email.value = client.email || ''; form.elements.phone.value = client.phone || ''; form.elements.birth_date.value = client.birth_date || ''; form.elements.notes.value = client.notes || ''; document.querySelector('#modal-title').textContent = 'Editar cliente'; event.target.closest('.actions-menu').classList.remove('open'); setModal(true); } if (action === 'delete') { if (!window.confirm(`Excluir o cadastro de ${client.name}?`)) return; try { const response = await fetch(`${apiBase}/api/clients/${client.id}`, { method: 'DELETE', headers: { Authorization: `Bearer ${token}` } }); const result = await lerJson(response, {}); if (!response.ok) { showToast(result.error || 'Não foi possível excluir o cliente. Tente novamente.'); return; } clients = clients.filter((item) => item.id !== client.id); renderClients(); showToast('Cliente excluído com sucesso.'); } catch (error) { showToast('Não foi possível excluir o cliente. Tente novamente.'); } } });
    document.addEventListener('click', (event) => { if (!event.target.closest('.actions-cell')) document.querySelectorAll('.actions-menu.open').forEach((menu) => menu.classList.remove('open')); });
    document.querySelector('#new-client').addEventListener('click', () => { editingClientId = null; form.reset(); document.querySelector('#modal-title').textContent = 'Cadastrar cliente'; setModal(true); }); document.querySelector('#close-modal').addEventListener('click', () => setModal(false)); document.querySelector('#cancel-modal').addEventListener('click', () => setModal(false)); modal.addEventListener('click', (event) => { if (event.target === modal) setModal(false); }); document.querySelector('#search').addEventListener('input', renderClients); document.querySelector('#logout-button').addEventListener('click', () => { sessionStorage.removeItem('cuidare_access_token'); window.location.replace('login.html'); });
    async function loadProfile() { try { const response = await fetch(`${apiBase}/api/psychologists/me`, { headers: { Authorization: `Bearer ${token}` } }); const result = await lerJson(response, {}); if (!response.ok) throw new Error(result.error || 'Não foi possível carregar seu perfil.'); const name = result.psychologist.name; document.querySelector('#sidebar-name').textContent = name; document.querySelector('#sidebar-avatar').textContent = CuidareFormat.initials(name); document.querySelector('#topbar-avatar').textContent = CuidareFormat.initials(name); } catch (error) { showToast(error.message); } }
    loadProfile(); loadClients();

    function goToEditProfile() { window.location.href = 'psychologist-dashboard.html?edit=1'; }
    document.querySelector('#open-edit-modal').addEventListener('click', goToEditProfile);
    document.querySelector('#topbar-avatar').addEventListener('click', goToEditProfile);
  </script>
</body>
</html>
